<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <section id="form">
        <form action="" id="formCadastro" class="border form p-5 d-flex flex-collumn gap-3 flex-wrap align-items-center justify-content-center" >
            <input type="text" id="userName" placeholder="Digite o nome do usuário">
            <input type="email" id="userEmail" placeholder="Digite o email do usuário">
            <input type="password" id="userPassword" placeholder="Digite a senha do usuário">
            <input type="password" id="userConfirmPassword" placeholder="Confirme a senha do usuário">
            <input type="submit" value="Cadastrar">
        </form>

    </section>
</body>
</html>
