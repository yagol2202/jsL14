<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
     <link rel="stylesheet" href="stilo.css">
</head>
<body>
  <div class="container mt-5">
    <div class="row">
        <!-- Formulário -->
        <div class="col-md-4">
            <div class="card p-4 shadow-sm">
                <h4>Cadastrar Produto</h4>
                <form id="productForm">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" id="name" class="form-control" required>
                        <div id="nameError" class="error-message">Este produto já foi cadastrado.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea id="description" class="form-control" rows="2" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Preço</label>
                        <input type="number" id="price" class="form-control" step="0.01" required>
                        <div id="priceError" class="error-message">O preço deve ser maior que zero.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL da Imagem</label>
                        <input type="url" id="imageUrl" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Adicionar Produto</button>
                </form>
            </div>
        </div>

        <!-- Exibição dos Cards -->
        <div class="col-md-8">
            <div id="productList" class="row row-cols-1 row-cols-md-2 g-4">
                <!-- Cards aparecerão aqui -->
            </div>
        </div>
    </div>
</div>


<section id="atividade2">
    <form action="" >
                <p>Comanda automática. Digite os valores e automaticamente os campos de Taxa de Serviço, Subtotal e Total serão preenchidos</p>
                <input type="number" id="entrada" placeholder="digite o valor da entrada">
    
                <input type="number" id="pratoPrincipal" placeholder="digite o valor do prato principal">
    
                <input type="number" id="bebidas" placeholder="digite o valor das bebidas">
    
                <input type="number" id="sobremesa" placeholder="digite o valor da sobremesa">
    
                <label for="taxaServico">Taxa de Serviço</label>
                <input type="number" id="taxaServico" placeholder="Taxa de serviço" value="0" disabled>
    
                <label for="subTotal">Subtotal</label><input type="number" id="subTotal" value="0" disabled></label>
    
                <label for="total">Total com taxas</label><input type="number" id="total" value="0" disabled></label>
            </form>
</section>
  <script src="evento.js"></script>
</body>
</html>
